plugins {
    id 'java'
}

group = 'eu.veldsoft.bths'
version = '1.0.0'

/**
 * Detect LibreOffice classes folder on different OSes
 */
def detectLibreOfficeClassesDir() {
    def candidates = []

    // 1. Check for the environment variable first
    def loHome = System.getenv('LIBREOFFICE_HOME')
    if (loHome) {
        candidates << "${loHome}\\program\\classes"
        candidates << "${loHome}/program/classes"
        candidates << loHome // Fallback if the user points directly to the classes dir
    }

    // 2. Add standard OS default paths
    if (System.properties['os.name'].toLowerCase().contains('win')) {
        candidates << "${System.getenv('ProgramFiles')}\\LibreOffice\\program\\classes"
        candidates << "${System.getenv('ProgramFiles(x86)')}\\LibreOffice\\program\\classes"
    } else if (System.properties['os.name'].toLowerCase().contains('mac')) {
        candidates << "/Applications/LibreOffice.app/Contents/Resources/java"
    } else {
        // Assume Linux/Unix-like
        candidates << "/usr/lib/libreoffice/program/classes"
        candidates << "/usr/share/libreoffice/program/classes"
    }

    // 3. Look for EITHER the aggregated jar OR one of the core split jars (e.g., juh.jar)
    return candidates.find { dir ->
        new File(dir, "libreoffice.jar").exists() || new File(dir, "juh.jar").exists()
    }
}

def libreOfficeClassesDir = detectLibreOfficeClassesDir()

if (libreOfficeClassesDir == null) {
    throw new GradleException("Could not find LibreOffice JARs. Please install LibreOffice or set the LIBREOFFICE_HOME environment variable to your installation directory.")
}

repositories {
    flatDir {
        dirs libreOfficeClassesDir
    }
}

dependencies {
    // Dynamically include all JARs found in the LibreOffice classes directory.
    // This safely handles both the single 'libreoffice.jar' and the split 'juh.jar', 'jurt.jar', etc.
    implementation fileTree(dir: libreOfficeClassesDir, include: ['*.jar'])
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    archiveBaseName = 'Bingo-Tropical-Hot-Simulator'
    from sourceSets.main.output
    manifest {
        attributes(
            'Main-Class': 'eu.veldsoft.bths.Simulator'
        )
    }
}

tasks.register('deploy', Copy) {
    dependsOn jar
    
    // Uses lazy archive property instead of the deprecated buildDir
    from jar.archiveFile
    from("parcel-descriptor.xml")

    // Properly handles deployment paths across all major OSes, including macOS
    def loUserScripts
    def osName = System.getProperty('os.name').toLowerCase()
    
    if (osName.contains('win')) {
        loUserScripts = "${System.getenv('APPDATA')}\\LibreOffice\\4\\user\\Scripts\\java\\Bingo-Tropical-Hot-Simulator"
    } else if (osName.contains('mac')) {
        loUserScripts = "${System.getProperty('user.home')}/Library/Application Support/LibreOffice/4/user/Scripts/java/Bingo-Tropical-Hot-Simulator"
    } else {
        loUserScripts = "${System.getProperty('user.home')}/.config/libreoffice/4/user/Scripts/java/Bingo-Tropical-Hot-Simulator"
    }

    into(loUserScripts)
}